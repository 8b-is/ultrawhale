name: hf-publish-dataset
on:
  push:
    paths: ['site/dogfood/*.jsonl', 'site/hf-dataset-card.md', 'site/qwen4_exp_model/**', '.github/workflows/hf-publish.yml']
  schedule:
    - cron: '0 */6 * * *'  # every 6h — consolidate telemetry batches
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci
    steps:
      - uses: actions/checkout@v6

      - name: Publish Qwen4-Exp Model & Voice-Finetuning RL Telemetry to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python3 - << 'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)

          # 1. Publish Model: PeetPedro/qwen4_exp-8b-obliterated-abliterated-kompress-ultra
          model_repo = "PeetPedro/qwen4_exp-8b-obliterated-abliterated-kompress-ultra"
          api.create_repo(repo_id=model_repo, repo_type="model", private=False, exist_ok=True)
          model_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "site" / "qwen4_exp_model"
          api.upload_folder(
              repo_id=model_repo,
              repo_type="model",
              folder_path=str(model_dir),
              commit_message="feat(qwen4_exp): publish Qwen4-Exp 8B obliterated-abliterated + wa-stream GRPO RL checkpoint",
          )
          print(f"Published model: https://huggingface.co/{model_repo}")

          # 2. Publish RL Rollout Telemetry to Dataset: PeetPedro/voice-finetuning
          voice_repo = "PeetPedro/voice-finetuning"
          api.create_repo(repo_id=voice_repo, repo_type="dataset", private=False, exist_ok=True)
          api.upload_file(
              path_or_fileobj=str(model_dir / "qwen4_exp_wa_stream_rl_rollouts.jsonl"),
              path_in_repo="data/qwen4_exp_wa_stream_rl_rollouts.jsonl",
              repo_id=voice_repo,
              repo_type="dataset",
              commit_message="feat(rl): sync Qwen4-Exp x wa-stream 11-epoch GRPO RL rollouts",
          )
          api.upload_file(
              path_or_fileobj=str(model_dir / "qwen4_exp_grpo_rl_policy.json"),
              path_in_repo="state/qwen4_exp_grpo_rl_policy.json",
              repo_id=voice_repo,
              repo_type="dataset",
              commit_message="feat(rl): sync Qwen4-Exp x wa-stream GRPO RL policy state",
          )
          print(f"Synced dataset: https://huggingface.co/datasets/{voice_repo}")
          PY

      - name: Push dogfeed + consolidate telemetry
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@ultrawhale.vaked.dev"
          git config --global user.name "ultrawhale-ci"
          git clone https://PeetPedro:${HF_TOKEN}@huggingface.co/datasets/PeetPedro/ultrawhale-dogfood /tmp/hf-push
          cd /tmp/hf-push

          # 0. Dataset card
          cp $GITHUB_WORKSPACE/site/hf-dataset-card.md README.md

          # 1. Copy new dogfeed files
          cp $GITHUB_WORKSPACE/site/dogfood/*.jsonl . 2>/dev/null || true

          # 2. Consolidate telemetry batches → telemetry-consolidated.jsonl
          if [ -d telemetry ] && [ "$(ls -A telemetry/*.jsonl 2>/dev/null)" ]; then
            cat telemetry/*.jsonl > telemetry-consolidated.jsonl.tmp
            # Only update if changed
            if [ ! -f telemetry-consolidated.jsonl ] || ! diff -q telemetry-consolidated.jsonl telemetry-consolidated.jsonl.tmp > /dev/null 2>&1; then
              mv telemetry-consolidated.jsonl.tmp telemetry-consolidated.jsonl
              echo "telemetry consolidated: $(wc -l < telemetry-consolidated.jsonl) events"
            else
              rm telemetry-consolidated.jsonl.tmp
            fi
          fi

          # 3. Merge JSONL → Parquet + regenerate growth chart
          pip install pyarrow pandas matplotlib numpy huggingface_hub --quiet
          python3 $GITHUB_WORKSPACE/scripts/plot_growth.py
          cp $GITHUB_WORKSPACE/site/dogfood/growth.png /tmp/hf-push/growth.png
          python3 $GITHUB_WORKSPACE/scripts/hf_optimize.py \
            --output-dir /tmp/hf-push \
            --telemetry-path /tmp/hf-push/telemetry-consolidated.jsonl
          echo "parquet optimization done"

          # 4. Auto-update MANIFEST with current stats
          DOGFEED_SAMPLES=$(cat dogfeed-*.jsonl 2>/dev/null | wc -l || echo 0)
          TELEMETRY_EVENTS=$(cat telemetry-consolidated.jsonl 2>/dev/null | wc -l || echo 0)
          TELEMETRY_BATCHES=$(ls telemetry/*.jsonl 2>/dev/null | wc -l || echo 0)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > MANIFEST-live.json << EOF
          {
            "updated_at": "${TIMESTAMP}",
            "streams": {
              "dogfeed": {
                "samples": ${DOGFEED_SAMPLES},
                "files": ["dogfeed-v1-initial.jsonl", "dogfeed-v2-science.jsonl", "dogfeed-v3-enriched.jsonl"],
                "source": "ultrawhale M3 loop (10s interval, free OpenRouter models)"
              },
              "telemetry": {
                "events": ${TELEMETRY_EVENTS},
                "batches": ${TELEMETRY_BATCHES},
                "consolidated": "telemetry-consolidated.jsonl",
                "sources": ["chat.vaked.dev", "protocol.vaked.dev", "music.vaked.dev", "beat.vaked.dev", "irc.vaked.dev", "pocoo.vaked.dev", "vaked.dev/ultrawhale"]
              }
            },
            "total_records": $((DOGFEED_SAMPLES + TELEMETRY_EVENTS)),
            "genesis_seal": "7c242080f5f821e5eaf563fe2208d60632c451687baf65f4fe8e4a0d226e3ecf",
            "dataset": "PeetPedro/ultrawhale-dogfood",
            "links": {
              "protocol": "https://protocol.vaked.dev",
              "chat": "https://chat.vaked.dev",
              "music": "https://music.vaked.dev",
              "beat": "https://beat.vaked.dev",
              "irc": "https://irc.vaked.dev",
              "pocoo": "https://pocoo.vaked.dev"
            }
          }
          EOF

          git add -A
          git diff --cached --quiet || git commit -m "auto: dogfeed=${DOGFEED_SAMPLES} telemetry=${TELEMETRY_EVENTS} [${TIMESTAMP}]"
          git push origin main
